<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Relatório de Heróis</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
html, body { 
  height:100%; 
  margin:0; 
  font-family: 'Segoe UI', Verdana, sans-serif; 
  color: white; 
  overflow-x: hidden;
  background: #000;
}

/* --- CAMADA DE FUNDO --- */
#bgLayer { 
  position: fixed; 
  inset: 0; 
  z-index: 0; 
  overflow: hidden; 
}
#bgLayer img { 
  width: 100%; 
  height: 100%; 
  object-fit: cover; 
  display: block; 
  pointer-events: none; 
  user-select: none; 
  filter: brightness(0.6);
}

/* --- CONTEÚDO PRINCIPAL --- */
.page-content { 
  position: relative; 
  z-index: 1; 
  padding: 0; 
}

/* --- FAIXA SUPERIOR (degradê vinho -> mais escuro) --- */
.header-bar {
  position: relative;
  text-align: center;
  font-weight: 500;
  font-size: 3.5rem;
  padding: 15px 0;
  color: white;
  margin: 0;
  width: 100%;
  font-family: 'Segoe UI', Verdana, sans-serif;
  background: linear-gradient(135deg, #7b001f, #5c0018 40%, #30000d 100%);
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  overflow: hidden;
  z-index: 2;
}

/* Linha dourada inferior */
.header-bar::after {
  content: '';
  display: block;
  height: 8px;
  background: linear-gradient(90deg, #FFD700, #fff6a9, #FFD700);
  width: 100%;
  position: absolute;
  bottom: 0;
  left: 0;
  z-index: 2;
}

/* Brilho metálico leve (agora estático) */
.header-bar::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(120deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02), transparent);
  z-index: 1;
  pointer-events: none;
}

/* --- LOGO DO TORNEIO (sem quadrado, sem borda) --- */
.torneio-logo {
  position: absolute;
  top: 8px;
  left: 25px;
  height: 80px;
  width: auto;
  z-index: 3;
  border: none;
  background: none;
  box-shadow: none;
  border-radius: 0;
}
/* --- LOGO FAB (superior direito) --- */
.fab-logo {
  position: absolute;
  top: 8px;
  right: 25px;
  height: 80px;
  width: auto;
  z-index: 3;
  border: none;
  background: none;
  box-shadow: none;
  border-radius: 0;
}


/* --- GRID DE HERÓIS --- */
.team-grid { 
  display: grid; 
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
  gap: 20px; 
  justify-items: center; 
  max-width: 1400px; 
  margin: 60px auto 0; 
  z-index: 1;
}

/* --- CARD DOS HERÓIS --- */
.hero-card {
  position: relative;
  width: 100%;
  aspect-ratio: 4/3; 
  border-radius: 16px;
  overflow: hidden;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,215,0,0.3);
  box-shadow: 0 6px 16px rgba(0,0,0,0.6);
  transition: transform 0.25s, box-shadow 0.25s;
}
.hero-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.hero-card:hover { 
  transform: scale(1.05); 
  box-shadow: 0 8px 22px rgba(255,215,0,0.6);
}

/* --- QUADRADO DE DADOS --- */
.hero-stats {
  position: absolute;
  bottom: 10px;
  left: 10px;
  background: linear-gradient(135deg, #800020, #a00030);
  color: #fff;
  padding: 6px 14px;
  border: 2px solid #FFD700;
  border-radius: 12px;
  font-weight: 900;
  text-align: center;
  min-width: 80px;
  font-family: 'Segoe UI', Verdana, sans-serif;
  box-shadow: 0 0 10px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
  align-items: center;
}
.hero-stats .count {
  font-size: 3.8rem;
  line-height: 1;
  color: #fff;
}
.hero-stats .percent {
  font-size: 1.4rem;
  margin-top: 4px;
  font-weight: 700;
  line-height: 1;
  color: #fff; /* branco */
}

/* --- QR CODE FIXO --- */
.qrcode {
  position: fixed;
  bottom: 25px;
  right: 25px;
  height: 150px;
  width: 150px;
  border-radius: 16px;
  border: 3px solid #FFD700;
  box-shadow: 0 0 20px rgba(255,215,0,0.6);
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(8px);
  z-index: 10;
}
</style>
</head>
<body>

<div id="bgLayer">
  <img id="bgImg" src="" alt="bg">
</div>

<div class="page-content">
  <img class="torneio-logo" src="image/logo/torneio.png" alt="Logo Torneio">
  <div class="header-bar" id="totalHeroes">Conversão: 0 Jogadores</div>
  <div id="heroGrid" class="team-grid"></div>
  <img class="fab-logo" src="image/logo/fab.png" alt="Logo FAB">
</div>

<img class="qrcode" src="image/logo/13Dominate_qrcode.png" alt="QR Code">

<script>
// --- Detecta backgrounds numerados automaticamente ---
const maxBG = 7;
const backgrounds = [];
let loadedBGs = 0;
const bgImg = document.getElementById("bgImg");

for (let i = 1; i <= maxBG; i++) {
  const img = new Image();
  img.src = `image/bg/${i}.jpg`;
  img.onload = () => {
    backgrounds.push(`image/bg/${i}.jpg`);
    loadedBGs++;
    if (loadedBGs === 1) setBG(0);
  };
}

let currentBG = 0;
function setBG(n) {
  currentBG = (n + backgrounds.length) % backgrounds.length;
  if (backgrounds.length) bgImg.src = backgrounds[currentBG];
}

// --- CSV ---
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRuKwiibVjvKNRI0cXNSpdxWP0lLwM2ehdLI5RK1U70612m4Rq7ZclHSZLTynfO33t-ZZu0-bDy_O3N/pub?output=csv&gid=1454665132
";

async function loadCSV() {
  try {
    const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(CSV_URL)}`);
    const text = await res.text();
    const lines = text.trim().split("\n").map(line => line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/));
    const header = lines.shift().map(h => h.trim().replace(/(^"|"$)/g, ""));
    const idxHero = header.indexOf("Hero");
    const idxFileName = header.indexOf("url");
    if (idxHero < 0 || idxFileName < 0) throw new Error("Coluna 'Hero' ou 'url' não encontrada.");
    
    const heroCountMap = {};
    for (const row of lines) {
      const heroName = row[idxHero].trim();
      const fileName = row[idxFileName].trim();
      if (!heroCountMap[heroName]) heroCountMap[heroName] = { count: 0, img: `image/icon/${fileName.trim()}` };
      heroCountMap[heroName].count++;
    }
    
    const totalHeroes = Object.values(heroCountMap).reduce((acc,h)=>acc+h.count,0);
    document.getElementById("totalHeroes").innerText = `Conversão: ${totalHeroes} Jogadores`;
    
    const heroList = Object.keys(heroCountMap)
      .map(name => ({ hero: name, img: heroCountMap[name].img, count: heroCountMap[name].count }))
      .sort((a,b) => b.count - a.count);
    
    renderCards(heroList, totalHeroes);
  } catch(err) {
    console.error("Erro ao carregar planilha:", err);
  }
}

// --- Renderiza os cards ---
function renderCards(list, total) {
  const grid = document.getElementById("heroGrid");
  grid.innerHTML = "";
  list.forEach(h => {
    const percent = ((h.count/total)*100).toFixed(0) + "%";
    const html = `<div class="hero-card" id="${h.hero}">
        <img src="${h.img || ''}" alt="${h.hero}">
        <div class="hero-stats">
          <span class="count">${h.count}</span>
          <span class="percent">${percent}</span>
        </div>
      </div>`;
    grid.insertAdjacentHTML("beforeend", html);
  });
}

// Inicializa
loadCSV();
</script>

</body>
</html>
