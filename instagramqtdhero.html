<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gerador Stories Responsivo — 1080x1920</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
  :root {
    --bg-dark: #000;
    --accent: #E07A5F;
    --vinho-1: #7b001f;
    --vinho-2: #30000d;
    --gold: #FFD700;
    --card-w: 220px;
  }

  html, body {
    width: 100%;
    min-height: 100vh;
    height: auto;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Verdana, sans-serif;
    background: var(--bg-dark);
    color: white;
    overflow-x: hidden;
  }

  /* Container responsivo central */
  .app-wrap {
    max-width: 1100px;
    margin: 18px auto;
    padding: 18px;
  }

  /* Cabeçalho */
  .header-bar {
    position: relative;
    text-align: center;
    font-weight: 600;
    font-size: clamp(20px, 3.2vw, 36px);
    padding: 14px 16px;
    color: white;
    background: linear-gradient(135deg, var(--vinho-1), #5c0018 40%, var(--vinho-2));
    border-radius: 12px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.6);
    border-bottom: 6px solid var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
  }

  .header-bar .title {
    flex: 1;
  }

  .logo-small {
    height: 64px;
    width: auto;
    object-fit:contain;
  }

  /* Fundo full-width (atrás do conteúdo) */
  #bgLayer {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 100%;
    min-width: 100vw;
    min-height: 100vh;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
    margin: 0;
    padding: 0;
  }
  #bgLayer img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    min-width: 100%;
    min-height: 100%;
    object-fit: cover;
    object-position: center center;
    filter: brightness(0.45) saturate(1.1);
    display: block;
    margin: 0;
    padding: 0;
  }

  /* Grid responsiva de heróis */
  .team-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 16px;
    margin-top: 18px;
  }

  .hero-card {
    position: relative;
    width: 100%;
    aspect-ratio: 4/3;
    border-radius: 12px;
    overflow: hidden;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,215,0,0.12);
    box-shadow: 0 6px 12px rgba(0,0,0,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .hero-card img.hero-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display:block;
  }

  .hero-stats {
    position: absolute;
    bottom: 10px;
    left: 10px;
    background: linear-gradient(135deg, #800020, #a00030);
    color: #fff;
    padding: 6px 10px;
    border: 2px solid var(--gold);
    border-radius: 10px;
    font-weight: 800;
    text-align: center;
    min-width: 70px;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .hero-stats .count { font-size: clamp(18px, 3.2vw, 28px); line-height:1; }
  .hero-stats .percent { font-size: clamp(12px, 2.4vw, 14px); opacity:0.95; }

  /* QR code e botões fixos */
  .qrcode {
    position: fixed;
    bottom: 18px;
    right: 18px;
    height: 110px;
    width: 110px;
    border-radius: 12px;
    border: 3px solid var(--gold);
    background: rgba(0,0,0,0.35);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 60;
  }
  .qrcode img { width: 90%; height: 90%; object-fit:contain; }

  #btnGerar {
    position: fixed;
    bottom: 18px;
    left: 18px;
    z-index: 60;
    padding: 12px 18px;
    font-size: 1rem;
    border-radius: 12px;
    border: 2px solid var(--gold);
    background: rgba(0,0,0,0.65);
    color: white;
    cursor: pointer;
    backdrop-filter: blur(6px);
  }
  #btnGerar:hover { background: var(--gold); color: black; }

  /* Info total (linha abaixo do header) */
  .total-info {
    margin-top: 12px;
    font-weight: 700;
    font-size: 1rem;
    color: #fff;
  }

  /* Mensagem de erro / carregando */
  .status {
    margin-top: 10px;
    opacity: 0.9;
  }

  /* Ajustes para telas muito pequenas */
  @media (max-width:420px) {
    .logo-small { height:48px; }
    .qrcode { height:90px; width:90px; right:12px; }
    #btnGerar { left:12px; bottom:12px; padding:10px 12px; }
  }
</style>
</head>
<body>

<div id="bgLayer"><img id="bgImg" src="" alt="bg"></div>

<div class="app-wrap container">
  <div class="header-bar">
    <img class="logo-small" src="image/logo/torneio.png" alt="logo torneio" onerror="this.style.display='none'">
    <div class="title">Relatório de Heróis</div>
    <img class="logo-small" src="image/logo/fab.png" alt="fab" onerror="this.style.display='none'">
  </div>

  <div class="total-info" id="totalHeroes">Conversão: 0 Jogadores</div>
  <div class="status text-muted" id="statusMsg">Carregando dados...</div>

  <div id="heroGrid" class="team-grid" aria-live="polite"></div>
</div>

<!-- QR e botão fixos -->
<div class="qrcode" title="Visite 13dominate">
  <img src="image/logo/13Dominate_qrcode.png" alt="QR" onerror="this.src='https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://13dominate.com'">
</div>

<button id="btnGerar" aria-label="Gerar Stories">📸 Gerar Stories</button>

<!-- html2canvas -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
/* ----------------------------
   CONFIGURAÇÕES (edite aqui)
   ---------------------------- */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRuKwiibVjvKNRI0cXNSpdxWP0lLwM2ehdLI5RK1U70612m4Rq7ZclHSZLTynfO33t-ZZu0-bDy_O3N/pub?output=csv&gid=1454665132";

const MAX_BG = 7; // verificar image/bg/1.jpg..MAX_BG
const LOCAL_ICON_PATH = "image/icon/"; // seu padrão no site
/* ---------------------------- */

const bgImg = document.getElementById("bgImg");
const heroGrid = document.getElementById("heroGrid");
const totalHeroesEl = document.getElementById("totalHeroes");
const statusMsg = document.getElementById("statusMsg");
const btnGerar = document.getElementById("btnGerar");

let backgrounds = [];
let bgLoadedCount = 0;

// Pré-carrega backgrounds (se existirem)
(function preloadBGs(){
  for(let i=1;i<=MAX_BG;i++){
    const url = `image/bg/${i}.jpg`;
    const img = new Image();
    img.onload = () => {
      backgrounds.push(url);
      bgLoadedCount++;
      // Define o primeiro background assim que carregar
      if (bgLoadedCount === 1) {
        setBG(0);
      }
    };
    img.onerror = () => {
      // Ignora se não existir, mas continua tentando os outros
      console.log(`Background ${i}.jpg não encontrado`);
    };
    img.src = url;
  }
})();

function setBG(idx){
  if (backgrounds.length === 0) {
    // Se não houver backgrounds carregados, define um padrão ou deixa vazio
    bgImg.src = "";
    return;
  }
  // Garante que o índice esteja dentro do range válido
  idx = ((idx % backgrounds.length) + backgrounds.length) % backgrounds.length;
  bgImg.src = backgrounds[idx];
}

/* ----------------------------
   Função para carregar CSV
   ---------------------------- */
async function loadCSV(){
  try {
    statusMsg.innerText = "Carregando planilha...";
    // usa allorigins para evitar CORS (pode trocar dependendo do host)
    const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(CSV_URL)}`);
    if (!res.ok) throw new Error("Não foi possível baixar CSV");
    const text = await res.text();

    // parse CSV simples (respeita vírgulas em aspas)
    const lines = text.trim().split("\n").map(l => l.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/));
    const header = lines.shift().map(h => h.trim().replace(/^"|"$/g,""));
    const idxHero = header.indexOf("Hero");
    const idxFileName = header.indexOf("url");

    if (idxHero < 0 || idxFileName < 0) {
      statusMsg.innerText = "CSV sem colunas 'Hero' ou 'url'.";
      return;
    }

    const heroCountMap = {};
    for (const row of lines) {
      const heroName = (row[idxHero] || "").trim();
      const fileName = (row[idxFileName] || "").trim();
      if (!heroName) continue;
      if (!heroCountMap[heroName]) heroCountMap[heroName] = { count: 0, img: fileName ? `${LOCAL_ICON_PATH}${fileName}` : '' };
      heroCountMap[heroName].count++;
    }

    const total = Object.values(heroCountMap).reduce((s,h)=>s+h.count,0);
    totalHeroesEl.innerText = `Conversão: ${total} Jogadores`;
    statusMsg.innerText = `Encontrados ${Object.keys(heroCountMap).length} heróis diferentes.`;

    // transforma pra lista ordenada
    const heroList = Object.keys(heroCountMap).map(name => ({
      hero: name,
      img: heroCountMap[name].img,
      count: heroCountMap[name].count
    })).sort((a,b) => b.count - a.count);

    renderCards(heroList, total);
    // armazena para geração de imagem depois
    window.__heroData = { total, heroList };

  } catch (err) {
    console.error(err);
    statusMsg.innerText = "Erro ao carregar CSV. Verifique a URL e CORS.";
  }
}

/* ----------------------------
   Renderiza os cards na tela
   ---------------------------- */
function renderCards(list, total){
  heroGrid.innerHTML = "";
  if (!list.length) {
    heroGrid.innerHTML = `<div class="text-muted">Nenhum herói encontrado</div>`;
    return;
  }
  for (const h of list) {
    const percent = total ? Math.round((h.count/total)*100) + "%" : "0%";
    const card = document.createElement("div");
    card.className = "hero-card";
    const img = document.createElement("img");
    img.className = "hero-img";
    img.alt = h.hero;
    img.src = h.img || ''; // local path normalmente, se não existir ficará vazio
    // se falhar no carregamento, tenta uma url pública (apenas para demo)
    img.onerror = function(){
      if (!this.dataset.triedFallback) {
        this.dataset.triedFallback = "1";
        // fallback público (pode trocar)
        this.src = `https://via.placeholder.com/400x300?text=${encodeURIComponent(h.hero)}`;
      }
    };

    const stats = document.createElement("div");
    stats.className = "hero-stats";
    stats.innerHTML = `<div class="count">${h.count}</div><div class="percent">${percent}</div>`;

    card.appendChild(img);
    card.appendChild(stats);
    heroGrid.appendChild(card);
  }
}

/* ----------------------------
   Gera imagem 1080x1920 sem mexer na UI
   - monta um container off-screen com o mesmo conteúdo
   - renderiza com html2canvas e baixa PNG em alta qualidade
   ---------------------------- */
async function gerarStories() {
  const data = window.__heroData;
  if (!data) {
    alert("Dados ainda não carregados.");
    return;
  }

  btnGerar.disabled = true;
  btnGerar.innerText = "Gerando...";

  // Cria container off-screen
  const storyW = 1080, storyH = 1920;
  const off = document.createElement("div");
  off.style.position = "fixed";
  off.style.left = "-9999px";
  off.style.top = "0";
  off.style.width = storyW + "px";
  off.style.height = storyH + "px";
  off.style.overflow = "hidden";
  off.style.background = "linear-gradient(180deg, #000000 0%, #1a1a1a 50%, #0d0d0d 100%)";
  off.style.padding = "0";
  off.style.margin = "0";
  off.style.boxSizing = "border-box";
  off.style.color = "white";
  off.style.fontFamily = "Segoe UI, Verdana, sans-serif";
  off.style.display = "flex";
  off.style.flexDirection = "column";
  off.style.justifyContent = "flex-start";

  // Faixa com logo Torneio dentro
  const headerBar = document.createElement("div");
  headerBar.style.width = "100%";
  headerBar.style.background = "linear-gradient(135deg, #7b001f, #5c0018 40%, #30000d 100%)";
  headerBar.style.padding = "25px 20px";
  headerBar.style.position = "relative";
  headerBar.style.borderBottom = "6px solid #FFD700";
  headerBar.style.boxShadow = "0 4px 15px rgba(0,0,0,0.5)";
  headerBar.style.flexShrink = "0";
  headerBar.style.display = "flex";
  headerBar.style.alignItems = "center";
  headerBar.style.justifyContent = "center";
  
  // Logo Torneio dentro do header
  const logoImg = document.createElement("img");
  logoImg.src = "image/logo/torneio.png";
  logoImg.style.height = "90px";
  logoImg.style.width = "auto";
  logoImg.style.maxWidth = "85%";
  logoImg.style.objectFit = "contain";
  logoImg.onerror = () => {
    logoImg.style.display = "none";
  };
  headerBar.appendChild(logoImg);
  off.appendChild(headerBar);

  // Texto de conversão
  const conversionDiv = document.createElement("div");
  conversionDiv.style.textAlign = "center";
  conversionDiv.style.fontWeight = "700";
  conversionDiv.style.fontSize = "38px";
  conversionDiv.style.padding = "20px 20px";
  conversionDiv.style.color = "white";
  conversionDiv.style.textShadow = "2px 2px 4px rgba(0,0,0,0.5)";
  conversionDiv.style.flexShrink = "0";
  conversionDiv.innerText = `Conversão: ${data.total} Jogadores`;
  off.appendChild(conversionDiv);

  // Calcula número de colunas baseado na quantidade de heróis
  const totalHeroes = data.heroList.length;
  let numCols = 3; // padrão
  
  // Lógica responsiva para determinar número de colunas
  if (totalHeroes <= 6) {
    numCols = 2;
  } else if (totalHeroes <= 12) {
    numCols = 3;
  } else if (totalHeroes <= 20) {
    numCols = 4;
  } else {
    // Para muitos heróis, usa 4 colunas e ajusta tamanho dos cards
    numCols = 4;
  }

  // Calcula espaço disponível para o grid (ajustado para os novos valores)
  const headerHeight = 121; // faixa com logo (25 + 25 + 90 logo + 6 linha dourada)
  const conversionHeight = 78; // texto conversão + padding (20 + 20 + 38)
  const gridPadding = 50; // padding top (20) + bottom (30) do grid
  const availableHeight = storyH - headerHeight - conversionHeight - gridPadding;
  
  // Calcula número de linhas
  const numRows = Math.ceil(totalHeroes / numCols);
  
  // Calcula gap total vertical
  const gapSize = 15;
  const totalGapHeight = (numRows - 1) * gapSize;
  
  // Calcula altura ideal dos cards para caber tudo
  // Garante altura mínima de 150px e máxima que caiba no espaço disponível
  let cardHeight = Math.floor((availableHeight - totalGapHeight) / numRows);
  cardHeight = Math.max(150, Math.min(cardHeight, 350)); // altura entre 150px e 350px
  
  // Recalcula se necessário para garantir que tudo caiba
  const totalNeededHeight = (numRows * cardHeight) + totalGapHeight;
  if (totalNeededHeight > availableHeight) {
    cardHeight = Math.floor((availableHeight - totalGapHeight) / numRows);
  }
  
  const cardWidth = Math.floor((storyW - 60 - (numCols - 1) * gapSize) / numCols); // 60 = padding lateral

  // Grid responsivo - mostra TODOS os heróis
  const grid = document.createElement("div");
  grid.style.display = "grid";
  grid.style.gridTemplateColumns = `repeat(${numCols}, 1fr)`;
  grid.style.gap = gapSize + "px";
  grid.style.padding = "20px 30px 30px";
  grid.style.width = "100%";
  grid.style.height = Math.min((numRows * cardHeight + totalGapHeight), availableHeight) + "px";
  grid.style.boxSizing = "border-box";
  grid.style.alignItems = "start";
  grid.style.overflow = "hidden";
  grid.style.flexShrink = "0";

  // Preload todas as imagens
  await Promise.all(data.heroList.map(h => preloadImage(h.img)));

  // Renderiza TODOS os heróis
  for (const h of data.heroList) {
    const card = document.createElement("div");
    card.style.position = "relative";
    card.style.borderRadius = "12px";
    card.style.overflow = "hidden";
    card.style.background = "rgba(255,255,255,0.08)";
    card.style.border = "2px solid rgba(255,215,0,0.3)";
    card.style.boxShadow = "0 4px 12px rgba(0,0,0,0.6)";
    card.style.height = cardHeight + "px";
    card.style.width = "100%";

    const img = document.createElement("img");
    img.alt = h.hero;
    img.style.width = "100%";
    img.style.height = "100%";
    img.style.objectFit = "cover";
    img.style.display = "block";
    img.src = h.img || `https://via.placeholder.com/400x300/1a1a1a/ffffff?text=${encodeURIComponent(h.hero)}`;
    img.onerror = function(){ 
      this.src = `https://via.placeholder.com/400x300/1a1a1a/ffffff?text=${encodeURIComponent(h.hero)}`; 
    };

    // Stats no canto inferior esquerdo do card - tamanho 1/2 do card (aumentado 100%)
    const stats = document.createElement("div");
    stats.style.position = "absolute";
    stats.style.bottom = "10px";
    stats.style.left = "10px";
    // Background translúcido 50% usando rgba
    stats.style.background = "linear-gradient(135deg, rgba(128, 0, 32, 0.5), rgba(160, 0, 48, 0.5))";
    stats.style.color = "#fff";
    // Tamanho do stats = reduzido em 15% (de 50% para 42.5% do card)
    const statsSize = cardHeight * 0.425;
    stats.style.width = statsSize + "px";
    stats.style.height = statsSize + "px";
    stats.style.padding = "12px";
    stats.style.border = "4px solid #FFD700";
    stats.style.borderRadius = "14px";
    stats.style.fontWeight = "900";
    stats.style.textAlign = "center";
    stats.style.boxShadow = "0 0 20px rgba(0,0,0,0.8), 0 0 12px rgba(255,215,0,0.4)";
    stats.style.display = "flex";
    stats.style.flexDirection = "column";
    stats.style.alignItems = "center";
    stats.style.justifyContent = "center";
    stats.style.boxSizing = "border-box";
    stats.style.backdropFilter = "blur(2px)"; // Adiciona leve desfoque para melhor legibilidade
    const percent = data.total > 0 ? Math.round((h.count/data.total)*100) : 0;
    // Ajusta tamanho da fonte baseado no tamanho do stats (1/2 do card) - fontes maiores
    const countFontSize = Math.max(40, Math.min(100, statsSize * 0.55));
    const percentFontSize = Math.max(24, Math.min(45, statsSize * 0.28));
    stats.innerHTML = `<div style="font-size: ${countFontSize}px; line-height: 1; font-weight: 900; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">${h.count}</div><div style="font-size: ${percentFontSize}px; line-height: 1; margin-top: 6px; opacity: 0.95; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">${percent}%</div>`;

    card.appendChild(img);
    card.appendChild(stats);
    grid.appendChild(card);
  }

  off.appendChild(grid);
  
  // Garante que o container tenha exatamente a altura correta
  const totalContentHeight = headerHeight + conversionHeight + (numRows * cardHeight + totalGapHeight) + gridPadding;
  if (totalContentHeight > storyH) {
    // Se exceder, reduz um pouco o padding ou ajusta
    grid.style.padding = "15px 30px 15px";
  }
  
  document.body.appendChild(off);

  // Espera carregamento das imagens - aumenta tempo para garantir que todas carreguem
  await new Promise(r => setTimeout(r, 800));

  // Renderiza com html2canvas (scale 2 para qualidade)
  try {
    const canvas = await html2canvas(off, {
      useCORS: true,
      allowTaint: false,
      backgroundColor: null,
      width: storyW,
      height: storyH,
      scale: 2,
      scrollX: 0,
      scrollY: 0
    });

    // Baixa a imagem
    const link = document.createElement("a");
    link.download = `relatorio-herois-${data.total}jogadores.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();
  } catch (err) {
    console.error("Erro ao gerar imagem:", err);
    alert("Falha ao gerar imagem. Veja console para detalhes.");
  } finally {
    // limpa container off-screen e restaura botão
    off.remove();
    btnGerar.disabled = false;
    btnGerar.innerText = "📸 Gerar Stories";
  }
}

/* Pré-carrega imagem tentando definir crossOrigin para reduzir problemas CORS */
function preloadImage(src){
  return new Promise(resolve => {
    if (!src) return resolve();
    try {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = ()=> resolve();
      img.onerror = ()=> resolve();
      img.src = src;
    } catch(e) { resolve(); }
  });
}

/* Evento do botão */
btnGerar.addEventListener("click", gerarStories);

/* Inicializa */
loadCSV();
</script>

</body>
</html>
