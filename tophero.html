<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top 8</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
html,body { height:100%; margin:0; }
#bgLayer { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
#bgLayer img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; user-select: none; }

body {
  font-family: 'Poppins', sans-serif;
  padding: 30px 0;
  color: white;
  background: #0e1a17;
}
.page-content { position: relative; z-index: 1; }

h2 {
  text-align: center;
  margin-bottom: 25px;
  font-weight: 600;
  text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
  color: #fff;
  font-size: 1.8rem;
}

#heroGrid {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  max-width: 700px;
  margin: 0 auto;
}

.team-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  background: rgba(0,0,0,0.6);
  border-radius: 10px;
  padding: 8px 15px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.4);
  transition: transform 0.2s;
}
.team-card:hover {
  transform: scale(1.02);
}

.icon {
  width: 55px;
  height: 55px;
  border-radius: 8px;
  background-size: cover;
  background-position: center;
  flex-shrink: 0;
}

.player-info {
  flex-grow: 1;
  text-align: center;
}

.player-name {
  font-weight: 600;
  font-size: 1rem;
  margin: 0;
  color: #fff;
  text-shadow: 1px 1px 3px #000;
}

.placeholder {
  width: 90px;
  height: 25px;
  border-radius: 16px;
  background: rgba(255,255,255,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ffffff;
  font-size: 1.05rem;
  flex-shrink: 0;
  font-weight: 700; /* Negrito */
}


.quiz-medal {
  position: absolute;
  top: -8px;
  left: -8px;
  width: 32px;
  height: 32px;
  z-index: 2;
}

.quiz-medal__circle {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  line-height: 32px;
  text-align: center;
  font-weight: bold;
  font-size: 0.8rem;
  color: #fff;
  box-shadow: 0 2px 5px rgba(0,0,0,0.5);
}
.quiz-medal__circle.gold { background: linear-gradient(145deg,#f9ad0e,#ffd700,#ffc107); }
.quiz-medal__circle.silver { background: linear-gradient(145deg,#d1d7da,#c0c0c0,#a9a9a9); }
.quiz-medal__circle.bronze { background: linear-gradient(145deg,#df7e08,#cd853f,#8b4513); }
.quiz-medal__circle.dark { background: linear-gradient(145deg,#333,#222,#111); }

#errorMsg { text-align: center; color: #ffdddd; margin-top: 15px; font-size: 0.9rem; }
</style>
</head>
<body>

<div id="bgLayer">
  <img id="bgImg" src="" alt="bg">
</div>

<div class="page-content">
  <div class="container">
    <h2>Top 8</h2>
    <div id="heroGrid"></div>
    <div id="errorMsg"></div>
  </div>
</div>

<script>
const NUM_BACKGROUNDS = 7;
const bgFiles = Array.from({length: NUM_BACKGROUNDS}, (_, i) => `${i+1}.jpg`);

function getBGFromURL() {
  const params = new URLSearchParams(window.location.search);
  let bgNumber = parseInt(params.get("bg"));
  if (isNaN(bgNumber) || bgNumber < 1 || bgNumber > NUM_BACKGROUNDS) bgNumber = 1;
  return bgNumber;
}
const bgNumber = getBGFromURL();
document.getElementById("bgImg").src = `image/bg/${bgFiles[bgNumber-1]}`;

function escapeHtml(str) {
  return str ? String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") : "";
}

function renderCards(list) {
  const grid = document.getElementById("heroGrid");
  grid.innerHTML = "";
  list.forEach(h => {
    const medalClass = h.rank===1?"gold":h.rank===2?"silver":h.rank===3?"bronze":"dark";
    const iconStyle = h.img ? `background-image: url('image/icon/${h.img}');` : `background: #555;`;
    const results = `${h.wins ?? 0} - ${h.losses ?? 0} - ${h.draws ?? 0}`;
    const card = `
      <div class="team-card position-relative">
        <div class="quiz-medal">
          <div class="quiz-medal__circle ${medalClass}">${h.rank}</div>
        </div>
        <div class="icon" style="${iconStyle}"></div>
        <div class="player-info">
          <p class="player-name">${escapeHtml(h.player)}</p>
        </div>
        <div class="placeholder">${results}</div>
      </div>
    `;
    grid.insertAdjacentHTML("beforeend", card);
  });
}

// 🟩 ALTERE AQUI o link do seu CSV
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSuFb7XuHidbVetdsK2rSDnMptjrN96FZxnsn7gCTUVHgCjPGf8I9lTxQP598sw0PBP3AHLYdDa3raw/pub?gid=117341349&single=true&output=csv";

async function loadCSV() {
  try {
    const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(CSV_URL)}`);
    if (!res.ok) throw new Error("Não foi possível carregar o CSV");
    const text = await res.text();
    const lines = text.trim().split("\n").map(line => line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/));
    const header = lines.shift().map(h => h.trim().replace(/(^"|"$)/g, ""));

    // 🟩 Índices das colunas — ajuste conforme o nome no seu CSV:
    const idxRank   = header.indexOf("Rank");
    const idxPlayer = header.indexOf("Name");
    const idxImg    = header.indexOf("imagem");
    const idxWins   = header.indexOf("win");
    const idxLosses = header.indexOf("lose");
    const idxDraws  = header.indexOf("draw");


    if (idxRank < 0 || idxPlayer < 0) throw new Error("Colunas obrigatórias ausentes.");

    const topPlayers = lines.map(row => {
      let playerName = (row[idxPlayer]||"").replace(/(^"|"$)/g,"").trim();
      if (playerName.includes(",")) playerName = playerName.split(",")[0];
      return {
        rank: parseInt(row[idxRank]?.trim()),
        player: playerName,
        img: (row[idxImg]||"").trim(),
        wins: parseInt(row[idxWins]) || 0,
        losses: parseInt(row[idxLosses]) || 0,
        draws: parseInt(row[idxDraws]) || 0
      };
    });

    renderCards(topPlayers);
  } catch (err) {
    document.getElementById("errorMsg").textContent = "Erro ao carregar planilha: " + err.message;
    console.error(err);
  }
}

loadCSV();
</script>

</body>
</html>
