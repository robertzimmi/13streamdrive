<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bracket Top 8 — Top Players</title>
<style>
:root{
  --bg:#0e1a17;
  --gold:#c9a34e;
  --text:#dfeee6;
}
body{
  background:var(--bg);
  color:var(--text);
  font-family: "Segoe UI", Roboto, sans-serif;
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  transition: background 0.5s ease;
  overflow:hidden;
}

.bracket-wrapper{
  width:1000px;
  text-align:center;
}

h1{ 
  text-align:center; 
  color:var(--gold); 
  margin-bottom:18px; 
  font-size:18px;
}

.bracket {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: repeat(7, 72px);
  gap: 0 60px;
  align-items: center;
  justify-content:center;
}

.match {
  width:240px;
  margin:0 auto;
  background: rgba(128,128,128,0.8);
  border:2px solid var(--gold);
  border-radius:8px;
  box-sizing:border-box;
  padding:8px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.player{
  background:rgba(255,255,255,0.06);
  border-radius:6px;
  padding:8px 10px;
  margin:6px 0;
  text-align:center;
  cursor:pointer;
  transition: all .12s;
  font-size:14px;
  font-weight:bold;
  display:flex;
  align-items:center;
  gap:8px;
  justify-content:flex-start;
}
.player img {
  width:24px;
  height:24px;
  border-radius:6px; /* alteração: ícone quadrado arredondado */
  display:inline-block;
}
.player.no-img img {
  display:none;
}
.player:hover{ background:var(--gold); color:#000; }
.winner{ background:var(--gold); color:#000; }

.q1 { grid-column: 1; grid-row: 1; }
.q2 { grid-column: 1; grid-row: 3; }
.q3 { grid-column: 1; grid-row: 5; }
.q4 { grid-column: 1; grid-row: 7; }
.s1 { grid-column: 2; grid-row: 2; }
.s2 { grid-column: 2; grid-row: 6; }
.f1 { grid-column: 3; grid-row: 4; }

@media(max-width:900px){
  body { align-items:flex-start; padding:20px; height:auto; overflow:auto; }
  .bracket{ grid-template-columns: 1fr; grid-template-rows: none; gap:12px; }
  .q1,.q2,.q3,.q4,.s1,.s2,.f1{ grid-column:auto; grid-row:auto; }
  .match{ width:100%; }
}
</style>
</head>
<body>
<div class="bracket-wrapper">
  <h1></h1>
  <div class="bracket" id="bracket">
    <div class="match q1" id="q1"></div>
    <div class="match q2" id="q2"></div>
    <div class="match q3" id="q3"></div>
    <div class="match q4" id="q4"></div>
    <div class="match s1" id="s1"></div>
    <div class="match s2" id="s2"></div>
    <div class="match f1" id="f1"></div>
  </div>
</div>

<script>
// Background via ?bg=1
const NUM_BG = 7;
const params = new URLSearchParams(window.location.search);
let bgNumber = parseInt(params.get("bg"));
if (isNaN(bgNumber) || bgNumber < 1 || bgNumber > NUM_BG) bgNumber = 1;
document.body.style.background = `url('image/bg/${bgNumber}.jpg') no-repeat center center fixed`;
document.body.style.backgroundSize = 'cover';

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSuFb7XuHidbVetdsK2rSDnMptjrN96FZxnsn7gCTUVHgCjPGf8I9lTxQP598sw0PBP3AHLYdDa3raw/pub?gid=117341349&single=true&output=csv";

function escapeHtml(str) { return str ? String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") : ""; }

async function loadCSV() {
  try {
    const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(CSV_URL)}`);
    if (!res.ok) throw new Error("Não foi possível carregar o CSV");
    const text = await res.text();
    const lines = text.trim().split("\n").map(line => line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/));
    const header = lines.shift().map(h => h.trim().replace(/(^"|"$)/g,""));
    const idxRank = header.indexOf("Rank");
    const idxPlayer = header.indexOf("Name");
    const idxImg = header.indexOf("imagem");
    if (idxRank < 0 || idxPlayer < 0 || idxImg < 0) throw new Error("Colunas 'Rank', 'Name' ou 'imagem' não encontradas.");

    const topPlayers = lines.map(row => {
      let playerName = (row[idxPlayer]||"").replace(/(^"|"$)/g,"").trim();
      if (playerName.includes(",")) playerName = playerName.split(",")[0];
      return {
        rank: parseInt(row[idxRank]?.trim()),
        player: playerName,
        img: (row[idxImg]||"").trim()
      };
    }).sort((a,b)=>a.rank-b.rank).slice(0,8);

    populateBracket(topPlayers);
  } catch(err){
    console.error(err);
    alert("Erro ao carregar dados: " + err.message);
  }
}

function buildPlayerElement(p){ 
  const isDash = p.player === '—';
  const imgTag = `<img src="${p.img ? 'image/icon/'+p.img : ''}" alt="">`;
  const noImgClass = isDash ? 'no-img' : '';
  return `<div class="player ${noImgClass}">${imgTag}<span>${escapeHtml(p.player)}</span></div>`;
}

function populateBracket(players){
  const qMatches = [
    [players[0], players[7]],
    [players[3], players[4]],
    [players[2], players[5]],
    [players[1], players[6]]
  ];

  document.getElementById('q1').innerHTML = qMatches[0].map(buildPlayerElement).join('');
  document.getElementById('q2').innerHTML = qMatches[1].map(buildPlayerElement).join('');
  document.getElementById('q3').innerHTML = qMatches[2].map(buildPlayerElement).join('');
  document.getElementById('q4').innerHTML = qMatches[3].map(buildPlayerElement).join('');

  document.getElementById('s1').innerHTML = buildPlayerElement({player:'—', img:''}) + buildPlayerElement({player:'—', img:''});
  document.getElementById('s2').innerHTML = buildPlayerElement({player:'—', img:''}) + buildPlayerElement({player:'—', img:''});
  document.getElementById('f1').innerHTML = buildPlayerElement({player:'—', img:''}) + buildPlayerElement({player:'—', img:''});
}

document.getElementById('bracket').addEventListener('click', ev=>{
  const el = ev.target.closest('.player');
  if(!el) return;
  if(el.querySelector('span').textContent==='—') return;

  const parentMatch = el.closest('.match');
  const parentId = parentMatch.id;

  parentMatch.querySelectorAll('.player').forEach(p=>p.classList.remove('winner'));
  el.classList.add('winner');

  if(parentId.startsWith('q')){
    const map = { q1:['s1',0], q2:['s1',1], q3:['s2',0], q4:['s2',1]};
    const [target, idx] = map[parentId];
    const targetEl = document.getElementById(target);
    const players = Array.from(targetEl.querySelectorAll('.player'));
    if(players[idx]){
      const imgSrc = el.querySelector('img') ? el.querySelector('img').src : '';
      players[idx].querySelector('span').textContent = el.querySelector('span').textContent;
      players[idx].querySelector('img').src = imgSrc;
      players[idx].classList.remove('no-img');
    }
    players.forEach(p=>p.classList.remove('winner'));
  } else if(parentId.startsWith('s')){
    const map = { s1:0, s2:1};
    const idx = map[parentId];
    const fEl = document.getElementById('f1');
    const players = Array.from(fEl.querySelectorAll('.player'));
    if(players[idx]){
      const imgSrc = el.querySelector('img') ? el.querySelector('img').src : '';
      players[idx].querySelector('span').textContent = el.querySelector('span').textContent;
      players[idx].querySelector('img').src = imgSrc;
      players[idx].classList.remove('no-img');
    }
    players.forEach(p=>p.classList.remove('winner'));
  }
  // ALERTA REMOVIDO: clique na final não mostra mais "é o campeão"
});

loadCSV();
</script>
</body>
</html>
